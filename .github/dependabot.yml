version: 2
updates:
  - package-ecosystem: docker
    directories:
    - /images/kube-deploy/container-image/images/buster-aws
    - /images/kube-deploy/container-image/images/buster-base
    - /images/kube-deploy/container-image/images/buster-gce
    - /images/kube-deploy/container-image/images/buster-qemu
    - /images/kube-deploy/container-image/tools/images/container-to-raw
    - /images/kube-deploy/imagebuilder
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: gomod
    directories:
    - /
    - /images/kube-deploy/imagebuilder
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: terraform
    directories:
    - /images/kube-deploy/container-image/cloud/aws-test
    - /images/kube-deploy/container-image/cloud/aws-upload
    - /images/kube-deploy/container-image/cloud/gce-test
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
